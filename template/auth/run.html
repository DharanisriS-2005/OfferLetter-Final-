<!DOCTYPE html>
<html>
<head>
    <title>Company Website</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
        }

        .page {
            display: none;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #home {
            display: flex;
            background: lightblue;
        }

        #offer {
            background: #f4f4f4;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        .box {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }
    </style>

    <script>
        function showOffer() {
            document.getElementById("home").style.display = "none";
            document.getElementById("offer").style.display = "flex";
        }

        function goBack() {
            document.getElementById("offer").style.display = "none";
            document.getElementById("home").style.display = "flex";
        }
    </script>
</head>

<body>

    <!-- Home Page -->
    <div id="home" class="page">
        <h1>Welcome to Our Company</h1>
        <p>Click below to view your offer letter</p>

        <button onclick="showOffer()">View Offer</button>
    </div>

    <!-- Offer Page -->
    <div id="offer" class="page">
        <div class="box">
            <h2>Offer Letter</h2>

            <p>Dear Rindhiya Loganathan,</p>

            <p>You are selected as <b>Software Developer</b>.</p>

            <p>Joining Date: <b>10 April 2026</b></p>

            <br>

            <button onclick="goBack()">Back</button>
        </div>
    </div>

</body>
</html>
